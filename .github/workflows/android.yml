name: Gerar APK Watv Player
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
      - name: Preparar SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Testar leitor de listas
        run: |
          mkdir -p build-tests
          javac -d build-tests app/src/main/java/com/watv/player/Playlist.java tests/PlaylistTest.java
          java -cp build-tests com.watv.player.PlaylistTest
      - name: Compilar APK de teste
        run: gradle --no-daemon assembleDebug
      - name: Habilitar aceleracao do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar em Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb shell am start -n com.watv.player/.MainActivity
            adb shell screencap -p /sdcard/watv-screen.png
            adb pull /sdcard/watv-screen.png watv-screen.png
      - name: Verificar assinatura
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Watv-Player-0.3-debug.apk
          sha256sum Watv-Player-0.3-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Watv-Player-APK
          path: |
            Watv-Player-0.3-debug.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Relatorios de verificacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Watv-Player-verificacao
          path: |
            app/build/reports/androidTests/
            watv-screen.png
          if-no-files-found: ignore
